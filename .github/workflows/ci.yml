name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI работает ТОЛЬКО с этим репозиторием. Ни один шаг не обращается к другим
# проектам на машине разработчика.

jobs:
  python:
    name: Python — контент, API, бот
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r api/requirements.txt

      - name: Compile all modules
        run: python -m compileall -q bot.py bot_i18n.py api tools tests

      - name: Content validation
        run: python tools/validate_content.py

      - name: Duplicate detection
        run: python tools/deduplicate_questions.py --strict

      - name: Sources metadata audit (offline)
        run: python tools/audit_sources.py --offline

      # По каталогу, а не списком: перечисленный руками тест-файл уже отставал
      # от реальности в других местах проекта (страницы в смоуке, треки в
      # проверках). Новый tests/test_*.py попадает в CI автоматически.
      - name: All Python tests (tests/test_*.py)
        run: |
          set -e
          for f in tests/test_*.py; do
            echo "==> $f"
            python "$f"
          done

      - name: Generated data is up to date with data/
        run: |
          python tools/build_webapp_data.py --check

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip install -q pip-audit
          pip-audit -r requirements.txt -r api/requirements.txt

  javascript:
    name: JavaScript — Mini App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Проверки Mini App читают сгенерированные данные, поэтому убеждаемся,
      # что они собраны из актуального источника.
      - name: Build generated data
        run: python tools/build_webapp_data.py

      - name: Syntax check
        run: |
          for f in webapp/*.js; do node --check "$f"; done

      # По каталогу, а не списком: новый webapp/_*_check.mjs попадает в CI
      # автоматически, ничего не нужно вписывать руками.
      - name: All Mini App checks (webapp/_*.mjs)
        run: |
          set -e
          for f in webapp/_*.mjs; do
            echo "==> $f"
            node "$f"
          done

  hygiene:
    name: Гигиена репозитория
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan for leaked Telegram bot tokens
        run: |
          # Формат токена: <8-10 цифр>:<35 символов base64url>.
          if grep -REn '\b[0-9]{8,10}:[A-Za-z0-9_-]{35}\b' \
               --include='*.py' --include='*.js' --include='*.mjs' \
               --include='*.json' --include='*.md' --include='*.html' \
               --include='*.txt' --include='*.yml' --include='*.sh' . ; then
            echo "::error::Похоже на токен Telegram в репозитории"
            exit 1
          fi
          echo "OK: токенов не найдено"

      - name: Ensure .env is not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env закоммичен — он должен быть только в .gitignore"
            exit 1
          fi
          echo "OK: .env не в репозитории"

      - name: Ensure no database or user data committed
        run: |
          BAD=$(git ls-files | grep -E '\.(db|db-wal|db-shm)$|^progress/|^sessions/' || true)
          if [ -n "$BAD" ]; then
            echo "::error::В репозитории пользовательские данные или БД:"
            echo "$BAD"
            exit 1
          fi
          echo "OK: пользовательских данных нет"

      - name: No large binary files
        run: |
          # Крупные бинарники в git раздувают историю необратимо.
          BIG=$(git ls-files | while read -r f; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -gt 1048576 ]; then echo "$f ($((size/1024)) KB)"; fi
          done)
          if [ -n "$BIG" ]; then
            echo "::warning::Файлы больше 1 МБ:"
            echo "$BIG"
          fi
          BIN=$(git ls-files | grep -E '\.(png|jpg|jpeg|gif|pdf|zip|mp3|mp4|docx|xlsx)$' || true)
          if [ -n "$BIN" ]; then
            echo "::error::Бинарные файлы в репозитории:"
            echo "$BIN"
            exit 1
          fi
          echo "OK: крупных бинарных файлов нет"

      - name: No leftovers from the reference project
        run: |
          # Морская предметная область и старые ключи хранилища не должны
          # встречаться нигде: их наличие означает недочищенный копипаст.
          # Сами сторожа не в счёт: в tools/validate_content.py и
          # tests/test_content.py эти слова лежат как чёрный список — там им и
          # место. Отфильтровываем по полному пути, а не по имени файла.
          GUARDS='^\./(tools/validate_content\.py|tests/test_content\.py):'

          HITS=$(grep -rEni 'żeglarz|zeglarz|sternik|colreg|\bissa\b|швартов|оверштаг' \
                   --include='*.py' --include='*.js' --include='*.mjs' \
                   --include='*.json' --include='*.html' --include='*.css' \
                   --exclude-dir=.git . | grep -vE "$GUARDS" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Найден контент референсного проекта"
            exit 1
          fi

          HITS=$(grep -rEn 'issa_|marine_|pl_progress_' \
                   --include='*.py' --include='*.js' --include='*.html' \
                   --include='*.json' --exclude-dir=.git . | grep -vE "$GUARDS" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Найдены старые ключи хранилища"
            exit 1
          fi
          echo "OK: следов референсного проекта нет"

      - name: Required documentation is present
        run: |
          for f in README.md ARCHITECTURE.md CONTENT_GUIDE.md PRIVACY.md \
                   CHANGELOG.md LICENSE REFERENCE_ANALYSIS.md \
                   deploy/DEPLOY.md deploy/DEPLOY_API.md .env.example; do
            if [ ! -f "$f" ]; then
              echo "::error::Нет обязательного файла $f"
              exit 1
            fi
          done
          echo "OK: документация на месте"
