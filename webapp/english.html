<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Английский для IT · Interview Trainer</title>
<link rel="stylesheet" href="theme.css">
<link rel="icon" href="icon.svg">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nav.js"></script>
<script src="generated/content_core.js"></script>
<script src="content-loader.js"></script>
<script src="srs.js"></script>
<script src="progress.js"></script>
<script src="readiness.js"></script>
<script src="sync.js"></script>
<script src="search.js"></script>
<script src="writing.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<style>
  .eng-row{ display:flex; align-items:center; gap:var(--sp-3); width:100%;
    text-align:left; font:inherit; color:var(--text); background:var(--card);
    border:1px solid var(--border); border-radius:var(--r-md);
    padding:var(--sp-3) var(--sp-4); margin-bottom:var(--sp-2); cursor:pointer }
  .eng-row .body{ flex:1; min-width:0 }
  .eng-row .t{ display:block; font-weight:700; font-size:var(--fs-body) }
  .eng-row .d{ display:block; color:var(--hint); font-size:var(--fs-sm); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .eng-row .box{ font-size:var(--fs-xs); color:var(--hint); flex:0 0 auto }
  .cat-title{ font-size:var(--fs-xs); font-weight:700; color:var(--hint);
    text-transform:uppercase; letter-spacing:.05em; margin:var(--sp-4) 0 var(--sp-2) }
  .en-line{ font-size:var(--fs-body); font-weight:600; line-height:1.5 }
  .ru-line{ color:var(--hint); font-size:var(--fs-sm); line-height:1.55; margin-top:4px }
  .ipa{ color:var(--accent); font-size:var(--fs-sm) }
  .snippet{ white-space:pre-wrap; word-break:break-word; font-size:var(--fs-sm);
    line-height:1.6; background:var(--muted-fill); border:1px solid var(--border);
    border-radius:var(--r-sm); padding:var(--sp-3); margin:var(--sp-2) 0 }
  .fav{ color:var(--warn) }
  .timer{ font-size:var(--fs-h1); font-weight:800; font-variant-numeric:tabular-nums }
  .rate-row{ display:flex; gap:6px; margin-top:var(--sp-3) }
  .rate-row button{ flex:1 }

  /* Поле для письменного задания. Моноширинный шрифт здесь не нужен: человек
     пишет письмо, а не код, и пропорциональный текст ближе к тому, как письмо
     увидит получатель. */
  .compose{ width:100%; box-sizing:border-box; min-height:190px; resize:vertical;
    font:inherit; font-size:var(--fs-sm); line-height:1.6; color:var(--text);
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--r-sm); padding:var(--sp-3) }
  .compose:focus{ outline:none; border-color:var(--accent) }
  .count-row{ display:flex; justify-content:space-between; align-items:center;
    margin-top:6px; font-size:var(--fs-xs); color:var(--hint) }
  .count-row .short{ color:var(--warn) }
  .rule{ display:flex; gap:var(--sp-2); align-items:flex-start;
    padding:var(--sp-2) 0; border-bottom:1px solid var(--border) }
  .rule:last-child{ border-bottom:none }
  .rule .st{ flex:0 0 auto; width:1.25em; text-align:center; font-weight:800 }
  .rule.done .st{ color:var(--ok) }
  .rule.miss .st{ color:var(--warn) }
  .rule .body{ flex:1; min-width:0 }
  .rule .t{ display:block; font-size:var(--fs-sm); font-weight:600 }
  .rule .d{ display:block; font-size:var(--fs-xs); color:var(--hint);
    line-height:1.5; margin-top:2px }
  .rule .found{ display:block; font-size:var(--fs-xs); color:var(--hint); margin-top:2px }
  .rule .found b{ color:var(--text) }
</style>
</head>
<body>

<!-- ── СПИСОК ── -->
<section id="list">
  <div class="hero">
    <span class="ic-tile blue" data-icon="globe"></span>
    <div class="body">
      <h1>Английский для IT</h1>
      <div class="muted small" id="sub"></div>
    </div>
  </div>

  <div class="chip-row" id="tabs" style="margin-bottom:var(--sp-3)">
    <button class="chip on" data-tab="phrases">Фразы</button>
    <button class="chip" data-tab="words">Слова</button>
    <button class="chip" data-tab="drills">Тренажёр</button>
    <button class="chip" data-tab="writing">Письмо</button>
    <button class="chip" data-tab="resources">Ресурсы</button>
  </div>

  <div class="search-box">
    <span class="emi plain" data-icon="search"></span>
    <input type="text" id="q" placeholder="Слово, фраза или ситуация" autocomplete="off">
    <button id="clear" class="hidden"><span class="emi plain" data-icon="x"></span></button>
  </div>

  <div class="chip-row" id="dirs" style="margin-bottom:var(--sp-3)"></div>
  <div class="chip-row" id="filters" style="margin-bottom:var(--sp-3)"></div>
  <div class="chip-row" id="cats" style="margin-bottom:var(--sp-3)"></div>

  <button class="btn hidden" id="studyBtn" style="margin-bottom:var(--sp-4)">Учить карточками</button>

  <div id="items"></div>
</section>

<!-- ── КАРТОЧКА ЗАПИСИ ── -->
<section id="detail" class="hidden"></section>

<!-- ── КАРТОЧКИ: СЛОВА В ОБЕ СТОРОНЫ И ФРАЗЫ ── -->
<!-- Разметка общая, содержимое лицевой и оборотной стороны собирается в JS:
     направлений три (узнавание слова, производство слова, фраза), и держать
     под каждое свой экран значило бы разойтись в поведении. -->
<section id="study" class="hidden">
  <div style="display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-3)">
    <div style="flex:1"><div class="meter"><i id="studyBar" style="width:0%"></i></div></div>
    <div class="small muted" id="studyCounter">0/0</div>
  </div>
  <div class="card">
    <div class="muted xs" id="studyCat"></div>
    <div id="studyPrompt" style="margin:6px 0 2px"></div>

    <div id="studyFront" style="margin-top:var(--sp-3)">
      <p class="small muted" id="studyTask"></p>
      <button class="btn" id="flipBtn">Показать разбор</button>
    </div>

    <div id="studyBack" class="hidden">
      <div id="studyAnswer" style="margin-top:var(--sp-3)"></div>
      <div class="btn-row" style="margin-top:var(--sp-3)">
        <button class="btn ghost" id="studyFail">Не знал</button>
        <button class="btn" id="studyOk">Знал</button>
      </div>
    </div>
  </div>
  <button class="btn ghost" id="studyExit">Выйти из карточек</button>
</section>

<script>
(function () {
  "use strict";

  var TABS = {
    phrases: { title: "Фразы", empty: "Фраз пока нет" },
    words: { title: "Слова", empty: "Слов пока нет" },
    drills: { title: "Тренажёр", empty: "Заданий пока нет" },
    writing: { title: "Письмо", empty: "Материалов пока нет" },
    resources: { title: "Ресурсы", empty: "Ресурсов пока нет" },
  };

  var data = {
    phrases: App.phrases(),
    words: App.words(),
    drills: App.drills(),
    writing: App.writings(),
    resources: App.engResources(),
  };
  var cats = {
    phrases: CONTENT.englishPhraseCategories || [],
    words: CONTENT.englishVocabCategories || [],
    drills: CONTENT.englishDrillCategories || [],
    writing: CONTENT.englishWritingCategories || [],
    resources: CONTENT.englishResourceCategories || [],
  };

  var tab = "phrases";
  var filter = "all";
  var cat = null;
  var query = "";
  var openId = null;
  var study = null;
  var timer = null;

  // Направление тренировки слов. «Узнавание» — вижу английское слово, вспоминаю
  // значение; «производство» — знаю смысл, достаю английское слово. Второе
  // нужно, чтобы говорить, и даётся заметно позже, поэтому направления живут в
  // разных коробках повторения и переключаются явно.
  var DIR_RECALL = "recall", DIR_PRODUCE = "produce";
  var dir = DIR_RECALL;

  var elList = document.getElementById("list");
  var elDetail = document.getElementById("detail");
  var elStudy = document.getElementById("study");

  // ── состояние записи ──
  function srsWord(w, d) {
    return (d || dir) === DIR_PRODUCE ? App.ewrid(w.id) : App.ewid(w.id);
  }
  function wordState(w, d) {
    var s = SRS.state(srsWord(w, d));
    var prof = (Progress.profile().english.words || {})[w.id] || {};
    return {
      box: s ? s.box : null,
      seen: !!s,
      due: s ? s.due <= Date.now() : true,
      known: !!(s && s.box >= SRS.LEARNED_BOX),
      favorite: !!prof.favorite,
    };
  }
  function phraseLearned(p) {
    var e = (Progress.profile().english.phrases || {})[p.id] || {};
    return !!e.learned;
  }
  function phraseState(p) {
    var s = SRS.state(App.ephid(p.id));
    return {
      box: s ? s.box : null,
      seen: !!s,
      due: s ? s.due <= Date.now() : true,
      known: !!(s && s.box >= SRS.LEARNED_BOX),
      learned: phraseLearned(p),
    };
  }
  function drillState(d) {
    var e = (Progress.profile().english.drills || {})[d.id] || {};
    return { done: typeof e.rating === "number", rating: e.rating, count: e.count || 0 };
  }
  function writingState(x) {
    var e = (Progress.profile().english.writing || {})[x.id] || {};
    return {
      hasTask: !!x.task,
      attempts: e.attempts || 0,
      passed: !!e.passed,
    };
  }

  // ── шапка и фильтры ──
  function renderHead() {
    var st = App.englishStats();
    document.getElementById("sub").textContent =
      st.phrases + " фраз · " + st.words + " слов · " + st.drills + " заданий вслух · " +
      st.writingTasks + " заданий на письмо · " + data.resources.length + " ресурсов";

    // Переключатель направления есть только у слов: у остальных разделов одна
    // сторона практики, и пустая строка чипов сбивала бы с толку.
    var dirs = document.getElementById("dirs");
    if (tab === "words") {
      dirs.classList.remove("hidden");
      dirs.innerHTML = [
        [DIR_RECALL, "Узнавать EN → RU"],
        [DIR_PRODUCE, "Вспоминать RU → EN"],
      ].map(function (o) {
        return '<button class="chip' + (dir === o[0] ? " on" : "") +
          '" data-dir="' + o[0] + '">' + App.esc(o[1]) + "</button>";
      }).join("");
    } else {
      dirs.classList.add("hidden");
      dirs.innerHTML = "";
    }

    var f = document.getElementById("filters");
    var opts;
    if (tab === "words") {
      opts = [["all", "Все"], ["new", "Не изучены"], ["due", "К повтору"],
        ["fav", "Избранное"], ["known", "Освоено"]];
    } else if (tab === "phrases") {
      opts = [["all", "Все"], ["due", "К повтору"], ["new", "Не тренировали"],
        ["learned", "Выучено"]];
    } else if (tab === "drills") {
      opts = [["all", "Все"], ["new", "Не пройдены"], ["weak", "Оценка ниже 3"]];
    } else if (tab === "writing") {
      opts = [["all", "Все"], ["todo", "Не пройдены"], ["done", "Пройдены"],
        ["template", "С заданием"], ["pattern", "Конструкции"]];
    } else {
      // Ресурсы — внешние ссылки без состояния, фильтровать нечего.
      opts = [["all", "Все"]];
    }
    f.innerHTML = opts.map(function (o) {
      return '<button class="chip' + (filter === o[0] ? " on" : "") +
        '" data-f="' + o[0] + '">' + App.esc(o[1]) + "</button>";
    }).join("");

    var list = data[tab];
    document.getElementById("cats").innerHTML =
      '<button class="chip' + (cat ? "" : " on") + '" data-cat="">Все разделы</button>' +
      (cats[tab] || []).map(function (c) {
        var n = list.filter(function (x) { return x.category === c; }).length;
        if (!n) return "";
        return '<button class="chip' + (cat === c ? " on" : "") + '" data-cat="' +
          App.esc(c) + '">' + App.esc(c) + " · " + n + "</button>";
      }).join("");

    var sb = document.getElementById("studyBtn");
    sb.classList.toggle("hidden", tab !== "words" && tab !== "phrases");
    sb.textContent = tab === "phrases" ? "Тренировать фразы"
      : dir === DIR_PRODUCE ? "Вспоминать карточками" : "Учить карточками";
  }

  // Поиск идёт по видимым полям записи: человек ищет и по-английски, и по-русски.
  function matches(x) {
    if (!query) return true;
    var q = Search.norm(query);
    var hay = Search.norm([
      x.en, x.ru, x.when, x.note, x.term, x.meaning, x.ru_hint, x.wrong,
      x.example_en, x.example_ru, x.prompt_en, x.prompt_ru, x.hint, x.title,
      x.why, x.how, x.publisher,
      // Условие письменного задания — тоже текст, по которому его ищут.
      x.task ? x.task.brief_ru : "", x.task ? x.task.model_en : "",
      (x.variants || []).join(" "), (x.keywords || []).join(" "),
    ].filter(Boolean).join(" "));
    return hay.indexOf(q) !== -1;
  }

  function filtered() {
    var list = data[tab].filter(matches);
    if (cat) list = list.filter(function (x) { return x.category === cat; });
    if (tab === "words") {
      if (filter === "new") list = list.filter(function (x) { return !wordState(x).seen; });
      else if (filter === "due") list = list.filter(function (x) {
        var s = wordState(x); return s.seen && s.due;
      });
      else if (filter === "fav") list = list.filter(function (x) { return wordState(x).favorite; });
      else if (filter === "known") list = list.filter(function (x) { return wordState(x).known; });
    } else if (tab === "phrases") {
      if (filter === "new") list = list.filter(function (x) { return !phraseState(x).seen; });
      else if (filter === "due") list = list.filter(function (x) {
        var s = phraseState(x); return s.seen && s.due;
      });
      else if (filter === "learned") list = list.filter(phraseLearned);
    } else if (tab === "drills") {
      if (filter === "new") list = list.filter(function (x) { return !drillState(x).done; });
      else if (filter === "weak") list = list.filter(function (x) {
        var s = drillState(x); return s.done && s.rating < 3;
      });
    } else if (tab === "writing") {
      // «С заданием» — это ровно заготовки: у конструкций задания нет, и
      // фильтровать их по прохождению было бы обещанием, которого экран не
      // выполняет.
      if (filter === "template") list = list.filter(function (x) { return !!x.task; });
      else if (filter === "pattern") list = list.filter(function (x) { return !x.task; });
      else if (filter === "todo") list = list.filter(function (x) {
        return x.task && !writingState(x).passed;
      });
      else if (filter === "done") list = list.filter(function (x) {
        return x.task && writingState(x).passed;
      });
    }
    return list;
  }

  // titleHtml собирается уже экранированным: у слова к названию добавляется
  // значок избранного, и «экранировать в конце» здесь молча съело бы разметку.
  function row(x) {
    var titleHtml, sub, mark;
    if (tab === "phrases") {
      var ps = phraseState(x);
      titleHtml = App.esc(x.en); sub = x.ru;
      mark = ps.learned ? "выучено" : ps.known ? "освоено"
        : ps.seen ? "коробка " + ps.box : "";
    } else if (tab === "words") {
      var s = wordState(x);
      titleHtml = App.esc(x.term) +
        (s.favorite ? ' <span class="emi plain fav" data-icon="star"></span>' : "");
      // В режиме производства подсказка на месте перевода обесценила бы
      // упражнение: в списке остаётся только транскрипция.
      sub = dir === DIR_PRODUCE ? x.ipa : x.ipa + " · " + x.meaning;
      mark = s.known ? "освоено" : s.seen ? "коробка " + s.box : "новое";
    } else if (tab === "drills") {
      var d = drillState(x);
      titleHtml = App.esc(x.prompt_en); sub = x.prompt_ru;
      mark = d.done ? "оценка " + d.rating : x.seconds + " с";
    } else if (tab === "writing") {
      var ws = writingState(x);
      titleHtml = App.esc(x.title);
      sub = ws.hasTask ? x.task.brief_ru : x.ru;
      mark = !ws.hasTask ? "конструкция" : ws.passed ? "пройдено"
        : ws.attempts ? "попыток " + ws.attempts : "задание";
    } else {
      titleHtml = App.esc(x.title); sub = x.why;
      mark = "уровень " + x.level;
    }
    return '<button class="eng-row" data-id="' + App.esc(x.id) + '">' +
      '<span class="body"><span class="t">' + titleHtml +
      '</span><span class="d">' + App.esc(sub) + "</span></span>" +
      '<span class="box">' + App.esc(mark) + "</span></button>";
  }

  function renderList() {
    renderHead();
    var list = filtered();
    var box = document.getElementById("items");
    if (!list.length) {
      box.innerHTML = '<div class="state">' +
        App.esc(query ? "Ничего не найдено" : TABS[tab].empty) + "</div>";
      return;
    }
    var html;
    if (query) {
      html = list.map(row).join("");
    } else {
      var byCat = {};
      list.forEach(function (x) { (byCat[x.category] = byCat[x.category] || []).push(x); });
      html = (cats[tab] || []).filter(function (c) { return byCat[c]; })
        .map(function (c) {
          return '<div class="cat-title">' + App.esc(c) + "</div>" +
            byCat[c].map(row).join("");
        }).join("");
    }
    box.innerHTML = html;
    Icons.hydrate(box);
  }

  // ── карточка записи ──
  function open(id) {
    var x = App.byId(data[tab], id);
    if (!x) {
      // Ссылка из поиска может вести на другую вкладку — ищем по всем.
      var keys = Object.keys(data);
      for (var i = 0; i < keys.length; i++) {
        var found = App.byId(data[keys[i]], id);
        if (found) { tab = keys[i]; x = found; break; }
      }
      if (!x) return;
      syncTabChips();
    }
    openId = id;
    var parts = [];

    if (tab === "phrases") parts = phraseCard(x);
    else if (tab === "words") parts = wordCard(x);
    else if (tab === "drills") parts = drillCard(x);
    else if (tab === "resources") parts = resourceCard(x);
    else parts = writingCard(x);

    parts.push('<button class="btn ghost" id="dBack" style="margin-top:var(--sp-3)">Назад к списку</button>');

    elDetail.innerHTML = parts.join("");
    elList.classList.add("hidden");
    elDetail.classList.remove("hidden");
    Icons.hydrate(elDetail);
    window.scrollTo(0, 0);
    bindDetail(x);
    document.getElementById("dBack").addEventListener("click", close);
  }

  function phraseCard(x) {
    var st = phraseState(x);
    var parts = [];
    parts.push('<div class="hero"><span class="ic-tile ' + (st.known ? "green" : "blue") +
      '" data-icon="message-square"></span>' +
      '<div class="body"><h1>' + App.esc(x.category) + "</h1>" +
      '<div class="muted small">Фраза · уровень ' + x.level +
      (st.seen ? " · коробка " + st.box : "") + "</div></div></div>");
    parts.push('<div class="card"><div class="en-line">' + App.esc(x.en) + "</div>" +
      '<div class="ru-line">' + App.esc(x.ru) + "</div></div>");
    parts.push('<div class="card"><div class="h3">Когда говорить</div>' +
      '<p class="small" style="line-height:1.65">' + App.esc(x.when) + "</p></div>");
    if (x.note) {
      parts.push('<div class="explain"><div class="h">На что смотрят</div>' +
        '<div class="small">' + App.esc(x.note) + "</div></div>");
    }
    if ((x.variants || []).length) {
      parts.push('<div class="card"><div class="h3">Ещё варианты</div>' +
        x.variants.map(function (v) {
          return '<div class="small" style="margin-bottom:6px; line-height:1.55">' +
            App.esc(v) + "</div>";
        }).join("") + "</div>");
    }
    // Карточка остаётся справочной — фразу сюда приходят и просто посмотреть.
    // Проверка себя вынесена отдельным блоком: она идёт в коробку повторения,
    // поэтому забытая фраза вернётся сама, без ручной отметки.
    parts.push('<div class="card"><div class="h3">Проверить себя</div>' +
      '<p class="small muted" style="line-height:1.6">Закройте фразу, вспомните её ' +
      'по ситуации выше и произнесите вслух. Отметьте честно: оценка решает, ' +
      "когда фраза вернётся на повтор.</p>" +
      '<div class="btn-row" style="margin-top:var(--sp-2)">' +
      '<button class="btn ghost" id="pFail">Не вспомнил</button>' +
      '<button class="btn" id="pOk">Вспомнил</button></div></div>');
    parts.push('<div class="btn-row"><button class="btn ghost" id="pLearn">' +

    if (!st.hasTask) {

    // Чек-лист спрятан: сперва человек пробует сам. Открытый заранее список

    parts.push('<div class="card"><div class="h3">Ваш текст</div>' +

      "устройстве и никуда не отправляется.</p></div>");

    parts.push('<div id="wResult"></div>');

      "Показать эталон и заготовку</button></div>");

      '<div class="card"><div class="h3">Эталонный ответ</div>' +

      '<div class="card"><div class="h3">По-русски</div>' +

  // Разбор попытки. Показываются и выполненные правила тоже: человеку важно
  // видеть, что засчиталось, а не только чего не хватает.
  function renderWritingResult(x, res) {
    var t = x.task;
    var head = res.passed
      ? '<div class="explain"><div class="h">Задание выполнено</div><div class="small">' +
        "Все обязательные части на месте, объём набран. Сверьтесь с эталоном: " +
        "он показывает не единственно верный текст, а привычный для жанра тон.</div></div>"
      : '<div class="explain"><div class="h">Ещё не всё</div><div class="small">' +
        "Ниже видно, чего не хватает. Дополните текст и проверьте снова — " +
        "попытки не ограничены.</div></div>";

    var rows = res.must.map(function (r, i) {
      return '<div class="rule ' + (r.ok ? "done" : "miss") + '">' +
        '<span class="st">' + (r.ok ? "✓" : "✗") + "</span>" +
        '<span class="body"><span class="t">' + App.esc(r.label) + "</span>" +
        (r.ok
          ? '<span class="found">нашлось: <b>' + App.esc(r.matched) + "</b></span>"
          : '<span class="d">' + App.esc(t.must[i].why) + "</span>") +
        "</span></div>";
    }).join("");

    var avoidRows = res.avoid.filter(function (r) { return !r.ok; }).map(function (r) {
      return '<div class="rule miss"><span class="st">!</span>' +
        '<span class="body"><span class="t">' + App.esc(r.label) +
        " · " + App.esc(r.matched) + "</span>" +
        '<span class="d">' + App.esc(r.why) + "</span></span></div>";
    }).join("");

    var words = '<div class="rule ' + (res.enough ? "done" : "miss") + '">' +
      '<span class="st">' + (res.enough ? "✓" : "✗") + "</span>" +
      '<span class="body"><span class="t">Объём: ' + res.words + " из " +
      res.minWords + "</span>" +
      (res.enough ? "" : '<span class="d">Короткое письмо обычно теряет либо ' +
        "контекст, либо вежливую рамку. Разверните то, чего не хватает по " +
        "списку выше.</span>") + "</span></div>";

    return head +
      '<div class="card"><div class="h3">Обязательные части · ' +
      res.mustDone + " из " + res.mustTotal + "</div>" + rows + words + "</div>" +
      (avoidRows ? '<div class="card"><div class="h3">Чего здесь быть не должно</div>' +
        avoidRows + "</div>" : "");
  }

  // Копирование через API буфера обмена, с запасным вариантом: в некоторых
  // клиентах Telegram navigator.clipboard недоступен.
  function copyText(text) {
    var done = function (ok) {
      if (window.haptic) haptic(ok ? "success" : "warning");
      toast(ok ? "Скопировано" : "Не удалось скопировать");
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); },
          function () { done(false); });
        return;
      }
    } catch (e) {}
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      done(ok);
    } catch (e2) { done(false); }
  }

  function bindDetail(x) {
    if (tab === "resources") return;
    if (tab === "phrases") {
      document.getElementById("pLearn").addEventListener("click", function () {
        var on = App.togglePhraseLearned(x.id);
        this.textContent = on ? "Убрать отметку" : "Выучил(а)";
        if (window.haptic) haptic("select");
      });
      document.getElementById("pCopy").addEventListener("click", function () {
        copyText(x.en);
      });
      document.getElementById("pOk").addEventListener("click", function () {
        checkPhrase(x.id, true);
      });
      document.getElementById("pFail").addEventListener("click", function () {
        checkPhrase(x.id, false);
      });
      return;
    }
    if (tab === "words") {
      document.getElementById("wOk").addEventListener("click", function () {
        checkWord(x.id, true);
      });
      document.getElementById("wFail").addEventListener("click", function () {
        checkWord(x.id, false);
      });
      document.getElementById("wFav").addEventListener("click", function () {
        var on = App.toggleWordFavorite(x.id);
        this.textContent = on ? "Убрать из избранного" : "В избранное";
        if (window.haptic) haptic("select");
      });
      return;
    }
    if (tab === "drills") {
      var left = x.seconds;
      var elT = document.getElementById("dTimer");
      document.getElementById("dStart").addEventListener("click", function () {
        stopTimer();
        left = x.seconds;
        elT.textContent = left;
        this.textContent = "Заново";
        document.getElementById("dTimerHint").textContent = "Говорите. Эталон — после ответа.";
        timer = setInterval(function () {
          left--;
          elT.textContent = left > 0 ? left : "0";
          if (left <= 0) {
            stopTimer();
            if (window.haptic) haptic("success");
            document.getElementById("dTimerHint").textContent = "Время вышло — сверьтесь с эталоном.";
          }
        }, 1000);
      });
      document.getElementById("dShow").addEventListener("click", function () {
        stopTimer();
        document.getElementById("dModelBox").classList.add("hidden");
        document.getElementById("dModel").classList.remove("hidden");
      });
      document.getElementById("dModel").addEventListener("click", function (e) {
        var b = e.target.closest("[data-rate]");
        if (!b) return;
        App.recordDrill(x.id, b.getAttribute("data-rate"));
        if (window.haptic) haptic("success");
        toast("Оценка сохранена");
        close();
      });
      return;
    }
    // ── письмо ──
    document.getElementById("sCopy").addEventListener("click", function () {
      copyText(x.en);
    });
    if (!x.task) return;

    var ta = document.getElementById("wText");
    var count = document.getElementById("wCount");
    var result = document.getElementById("wResult");

    function refreshCount() {
      var n = Writing.countWords(ta.value);
      count.textContent = n + " " + App.plural(n, "слово", "слова", "слов");
      count.className = n < x.task.min_words ? "short" : "";
    }
    ta.addEventListener("input", refreshCount);
    refreshCount();

    document.getElementById("wRules").addEventListener("click", function () {
      var box = document.getElementById("wRulesBox");
      var shown = box.classList.toggle("hidden");
      this.textContent = shown ? "Показать, что должно быть в письме" : "Скрыть список";
    });

    document.getElementById("wCheck").addEventListener("click", function () {
      var text = ta.value;
      // Пустое поле — это не попытка: засчитывать её в статистику значило бы
      // показывать работу там, где её не было.
      if (!Writing.countWords(text)) {
        toast("Сначала напишите текст");
        return;
      }
      var res = Writing.check(text, x.task);
      result.innerHTML = renderWritingResult(x, res);
      App.recordWritingAttempt(x.id, res.passed);
      if (window.haptic) haptic(res.passed ? "success" : "warning");
      result.scrollIntoView({ block: "start" });
    });

    document.getElementById("wShow").addEventListener("click", function () {
      document.getElementById("wModelBox").classList.add("hidden");
      document.getElementById("wModel").classList.remove("hidden");
    });
  }

  // ── карточки: слова в обе стороны и фразы ──
  //
  // Очередь собирается из того, что уже отфильтровано на экране: человек видел
  // список и запустил тренировку именно по нему. Идентификаторы SRS сопоставлены
  // с записями через карту, а не отрезанием префикса по длине: префиксы «ew» и
  // «ewr» отличаются одним символом, и арифметика по длине здесь тихо смешала
  // бы два направления.
  function startStudy() {
    var kind = tab === "phrases" ? "phrases" : "words";
    var pool = filtered();
    if (!pool.length) pool = data[kind];

    var byId = {};
    pool.forEach(function (x) {
      byId[kind === "phrases" ? App.ephid(x.id) : srsWord(x)] = x;
    });
    var ids = SRS.pickDue(Object.keys(byId), 20);
    var list = ids.map(function (id) { return byId[id]; }).filter(Boolean);
    if (!list.length) { toast("Нечего повторять"); return; }

    study = { kind: kind, dir: dir, list: list, i: 0, ok: 0 };
    if (window.setBusy) setBusy(true);
    elList.classList.add("hidden");
    elDetail.classList.add("hidden");
    elStudy.classList.remove("hidden");
    renderStudy();
  }

  function renderStudy() {
    var x = study.list[study.i];
    document.getElementById("studyCounter").textContent =
      (study.i + 1) + "/" + study.list.length;
    document.getElementById("studyBar").style.width =
      Math.round(study.i / study.list.length * 100) + "%";
    document.getElementById("studyCat").textContent = x.category;

    var prompt, task, answer;
    if (study.kind === "phrases") {
      // Спрашиваем ситуацией, а не переводом: на собеседовании человек
      // вспоминает фразу по обстоятельствам, а не по русской строке.
      prompt = '<div style="font-size:var(--fs-body); font-weight:700; line-height:1.5">' +
        App.esc(x.when) + "</div>" +
        '<div class="ru-line">Смысл: ' + App.esc(x.ru) + "</div>";
      task = "Произнесите английскую фразу вслух, потом проверьте себя.";
      answer = '<div class="en-line">' + App.esc(x.en) + "</div>" +
        ((x.variants || []).length
          ? '<div class="explain" style="margin-top:var(--sp-3)">' +
            '<div class="h">Ещё варианты</div><div class="small">' +
            x.variants.map(App.esc).join("<br>") + "</div></div>"
          : "") +
        (x.note ? '<p class="small muted" style="margin-top:var(--sp-2); line-height:1.6">' +
          App.esc(x.note) + "</p>" : "");
    } else if (study.dir === DIR_PRODUCE) {
      prompt = '<div style="font-size:var(--fs-h2); font-weight:800; line-height:1.4">' +
        App.esc(x.meaning) + "</div>";
      task = "Назовите английское слово вслух, потом проверьте себя.";
      answer = '<div style="font-size:var(--fs-h1); font-weight:800">' +
        App.esc(x.term) + "</div>" +
        '<div class="ipa">' + App.esc(x.ipa) + "</div>" +
        '<div class="explain" style="margin-top:var(--sp-3)"><div class="h">Как звучит</div>' +
        '<div class="small">Примерно так: ' + App.esc(x.ru_hint) + "</div></div>" +
        '<p class="small muted" style="margin-top:var(--sp-2)">Неверно: ' +
        App.esc(x.wrong) + "</p>" +
        '<p class="small" style="margin-top:var(--sp-2); line-height:1.6">' +
        App.esc(x.example_en) + "</p>";
    } else {
      prompt = '<div style="font-size:var(--fs-h1); font-weight:800">' +
        App.esc(x.term) + "</div>" +
        '<div class="ipa">' + App.esc(x.ipa) + "</div>";
      task = "Произнесите вслух и вспомните значение, потом проверьте себя.";
      answer = '<p class="small" style="line-height:1.65">' + App.esc(x.meaning) + "</p>" +
        '<div class="explain"><div class="h">Как звучит</div>' +
        '<div class="small">Примерно так: ' + App.esc(x.ru_hint) + "</div></div>" +
        '<p class="small muted" style="margin-top:var(--sp-2)">Неверно: ' +
        App.esc(x.wrong) + "</p>" +
        '<p class="small" style="margin-top:var(--sp-2); line-height:1.6">' +
        App.esc(x.example_en) + "</p>";
    }

    document.getElementById("studyPrompt").innerHTML = prompt;
    document.getElementById("studyTask").textContent = task;
    document.getElementById("studyAnswer").innerHTML = answer;
    document.getElementById("studyFront").classList.remove("hidden");
    document.getElementById("studyBack").classList.add("hidden");
    Icons.hydrate(elStudy);
    window.scrollTo(0, 0);
  }

  function studyAnswer(ok) {
    var x = study.list[study.i];
    if (study.kind === "phrases") App.recordPhraseCheck(x.id, ok);
    else App.recordWordCheck(x.id, ok, study.dir);
    if (ok) study.ok++;
    if (window.haptic) haptic(ok ? "success" : "warning");
    study.i++;
    if (study.i >= study.list.length) {
      var n = study.list.length, good = study.ok;
      exitStudy();
      toast("Карточки: " + good + " из " + n + " верно");
    } else {
      renderStudy();
    }
  }

  function exitStudy() {
    study = null;
    if (window.setBusy) setBusy(false);
    elStudy.classList.add("hidden");
    elList.classList.remove("hidden");
    renderList();
    window.scrollTo(0, 0);
  }

  document.getElementById("flipBtn").addEventListener("click", function () {
    document.getElementById("studyFront").classList.add("hidden");
    document.getElementById("studyBack").classList.remove("hidden");
  });
  document.getElementById("studyOk").addEventListener("click", function () { studyAnswer(true); });
  document.getElementById("studyFail").addEventListener("click", function () { studyAnswer(false); });
  document.getElementById("studyExit").addEventListener("click", exitStudy);
  document.getElementById("studyBtn").addEventListener("click", startStudy);

  // ── вкладки, фильтры, поиск ──
  function syncTabChips() {
    Array.prototype.forEach.call(document.getElementById("tabs").children, function (c) {
      c.classList.toggle("on", c.getAttribute("data-tab") === tab);
    });
  }

  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]");
    if (!b) return;
    tab = b.getAttribute("data-tab");
    filter = "all";
    cat = null;
    syncTabChips();
    renderList();
    window.scrollTo(0, 0);
  });

  document.getElementById("dirs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-dir]");
    if (!b) return;
    dir = b.getAttribute("data-dir");
    // Фильтры «не изучены», «к повтору» и «освоено» считаются по коробке
    // ВЫБРАННОГО направления, поэтому список пересобирается целиком.
    renderList();
  });

  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest("[data-f]");
    if (!b) return;
    filter = b.getAttribute("data-f");
    renderList();
  });

  document.getElementById("cats").addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]");
    if (!b) return;
    cat = b.getAttribute("data-cat") || null;
    renderList();
  });

  document.getElementById("items").addEventListener("click", function (e) {
    var b = e.target.closest("[data-id]");
    if (b) open(b.getAttribute("data-id"));
  });

  var input = document.getElementById("q");
  var clearBtn = document.getElementById("clear");
  input.addEventListener("input", function () {
    query = input.value.trim();
    clearBtn.classList.toggle("hidden", !query);
    renderList();
  });
  clearBtn.addEventListener("click", function () {
    input.value = ""; query = ""; clearBtn.classList.add("hidden"); renderList();
  });

  window.__navBack = function () {
    if (study) { exitStudy(); return true; }
    if (openId) { close(); return true; }
    return false;
  };

  var wanted = App.param("tab");
  if (wanted && TABS[wanted]) { tab = wanted; syncTabChips(); }
  renderList();
  Icons.hydrate();
  var id = App.param("id");
  if (id) open(id);
})();
</script>
</body>
</html>
