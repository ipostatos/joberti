<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Библиотека · Interview Trainer</title>
<link rel="stylesheet" href="theme.css">
<link rel="icon" href="icon.svg">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nav.js"></script>
<script src="generated/content_core.js"></script>
<script src="content-loader.js"></script>
<script src="srs.js"></script>
<script src="progress.js"></script>
<script src="readiness.js"></script>
<script src="sync.js"></script>
<script src="search.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<style>
  .res{ background:var(--card); border:1px solid var(--border);
    border-radius:var(--r-md); padding:var(--sp-3) var(--sp-4); margin-bottom:var(--sp-2) }
  .res .top{ display:flex; align-items:flex-start; gap:var(--sp-3) }
  .res .body{ flex:1; min-width:0 }
  .res .t{ font-weight:700; font-size:var(--fs-body); line-height:1.35 }
  .res .pub{ color:var(--hint); font-size:var(--fs-xs); margin-top:3px }
  .res .why{ color:var(--hint); font-size:var(--fs-sm); margin-top:var(--sp-2); line-height:1.5 }
  .res .meta{ display:flex; gap:var(--sp-2); flex-wrap:wrap; margin-top:var(--sp-3) }
  .res .actions{ display:flex; gap:var(--sp-2); margin-top:var(--sp-3) }
  .res .actions .btn{ flex:1 }
  .must{ color:var(--warn); font-size:var(--fs-xs); font-weight:700 }
  .noteBox{ margin-top:var(--sp-3) }
</style>
</head>
<body>

<div class="hero">
  <span class="ic-tile blue" data-icon="library"></span>
  <div class="body">
    <h1>Библиотека</h1>
    <div class="muted small" id="sub"></div>
  </div>
</div>

<div class="card" id="stat"></div>

<div class="search-box">
  <span class="emi plain" data-icon="search"></span>
  <input type="text" id="q" placeholder="Название или издатель" autocomplete="off">
  <button id="clear" class="hidden"><span class="emi plain" data-icon="x"></span></button>
</div>

<div class="chip-row" id="filters" style="margin-bottom:var(--sp-2)">
  <button class="chip on" data-f="all">Все</button>
  <button class="chip" data-f="must">До собеседования</button>
  <button class="chip" data-f="unread">Не прочитано</button>
  <button class="chip" data-f="read">Прочитано</button>
</div>

<div class="chip-row" id="topicFilters" style="margin-bottom:var(--sp-2)"></div>
<div class="chip-row" id="levelFilters" style="margin-bottom:var(--sp-3)">
  <button class="chip on" data-l="0">Любая сложность</button>
  <button class="chip" data-l="1">Базовая</button>
  <button class="chip" data-l="2">Средняя</button>
  <button class="chip" data-l="3">Продвинутая</button>
</div>

<div id="items"></div>

<a class="btn ghost" href="index.html" style="margin-top:var(--sp-4)">На главную</a>

<div class="foot">
  Материалы ведут на сайты правообладателей. Книги и защищённые тексты
  в приложении не хранятся.
</div>

<script>
(function () {
  "use strict";

  var resources = CONTENT.library;
  var filter = "all";
  var topicFilter = null;
  var level = 0;
  var query = "";

  var index = Search.buildIndex({ library: resources }, null);

  var TYPE_LABEL = {
    official_documentation: "документация",
    specification: "спецификация",
    guide: "гайд",
    checklist: "чек-лист",
    article: "статья",
    video: "видео",
    tool_documentation: "документация инструмента",
    tool: "инструмент",
    practical_task: "практика",
    cheatsheet: "шпаргалка",
  };
  var LEVEL_LABEL = { 1: "базовая", 2: "средняя", 3: "продвинутая" };

  function stateOf(id) {
    return (Progress.profile().library || {})[id] || {};
  }

  function renderHead() {
    var read = resources.filter(function (x) { return stateOf(x.id).read; }).length;
    var must = resources.filter(function (x) { return x.read_before_interview; });
    var mustRead = must.filter(function (x) { return stateOf(x.id).read; }).length;
    var mins = resources.reduce(function (a, x) { return a + (x.estimated_minutes || 0); }, 0);

    document.getElementById("sub").textContent =
      resources.length + " проверенных материалов · около " + Math.round(mins / 60) + " часов чтения";

    document.getElementById("stat").innerHTML =
      '<div class="kv"><span class="k">Прочитано</span><span class="v">' +
      read + " из " + resources.length + "</span></div>" +
      '<div class="kv"><span class="k">Обязательное до собеседования</span><span class="v">' +
      mustRead + " из " + must.length + "</span></div>" +
      '<div class="kv"><span class="k">Ссылки проверены</span><span class="v">' +
      resources.filter(function (x) { return x.verification_status === "verified"; }).length +
      " из " + resources.length + "</span></div>";

    var used = {};
    resources.forEach(function (x) {
      (x.topic_ids || []).forEach(function (t) { used[t] = true; });
    });
    document.getElementById("topicFilters").innerHTML =
      '<button class="chip' + (topicFilter ? "" : " on") + '" data-t="">Все темы</button>' +
      App.topics().filter(function (t) { return used[t.id]; }).map(function (t) {
        return '<button class="chip' + (topicFilter === t.id ? " on" : "") +
          '" data-t="' + App.esc(t.id) + '">' + App.esc(t.title) + "</button>";
      }).join("");
  }

  function filtered() {
    var list = resources;
    if (query) {
      var order = {};
      Search.query(index, query, { limit: 200 }).forEach(function (h) {
        order[h.entry.id] = h.score;
      });
      list = list.filter(function (x) { return order[x.id] !== undefined; })
        .sort(function (a, b) { return order[b.id] - order[a.id]; });
    }
    if (filter === "must") list = list.filter(function (x) { return x.read_before_interview; });
    else if (filter === "unread") list = list.filter(function (x) { return !stateOf(x.id).read; });
    else if (filter === "read") list = list.filter(function (x) { return stateOf(x.id).read; });
    if (topicFilter) list = list.filter(function (x) {
      return (x.topic_ids || []).indexOf(topicFilter) !== -1;
    });
    if (level) list = list.filter(function (x) { return x.difficulty === level; });
    return list;
  }

  function render() {
    renderHead();
    var list = filtered();
    if (!list.length) {
      document.getElementById("items").innerHTML = '<div class="state">Ничего не найдено</div>';
      return;
    }

    // Обязательное к прочтению — первым: это то, что реально влияет на исход.
    list = list.slice().sort(function (a, b) {
      if (!!b.read_before_interview !== !!a.read_before_interview) {
        return b.read_before_interview ? 1 : -1;
      }
      return a.difficulty - b.difficulty;
    });

    document.getElementById("items").innerHTML = list.map(function (x) {
      var st = stateOf(x.id);
      var note = st.note || "";
      return '<div class="res" data-id="' + App.esc(x.id) + '">' +
        '<div class="top">' +
        '<span class="ic-tile ' + (st.read ? "green" : "blue") + '" data-icon="' +
        (st.read ? "check-circle" : "library") + '"></span>' +
        '<div class="body">' +
        '<div class="t">' + App.esc(x.title) + "</div>" +
        '<div class="pub">' + App.esc(x.publisher) + " · " + App.esc(x.language) +
        (x.read_before_interview ? ' · <span class="must">до собеседования</span>' : "") +
        "</div></div></div>" +
        '<div class="why">' + App.esc(x.why_read) + "</div>" +
        '<div class="meta">' +
        '<span class="chip">' + App.esc(TYPE_LABEL[x.type] || x.type) + "</span>" +
        '<span class="chip">' + App.esc(LEVEL_LABEL[x.difficulty] || "") + "</span>" +
        '<span class="chip">' + (x.estimated_minutes || 0) + " мин</span>" +
        (x.verification_status === "verified"
          ? '<span class="chip">проверено ' + App.esc(x.last_verified || "") + "</span>"
          : '<span class="chip" style="color:var(--warn)">требует проверки</span>') +
        "</div>" +
        '<div class="actions">' +
        '<a class="btn sm" href="' + App.esc(x.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<span class="emi" data-icon="external-link"></span>Открыть</a>' +
        '<button class="btn sm ghost" data-read="' + App.esc(x.id) + '">' +
        (st.read ? "Прочитано" : "Отметить") + "</button>" +
        '<button class="btn sm ghost" data-note="' + App.esc(x.id) + '">' +
        '<span class="emi plain" data-icon="edit"></span></button>' +
        "</div>" +
        (note ? '<div class="why noteBox"><b>Заметка:</b> ' + App.esc(note) + "</div>" : "") +
        "</div>";
    }).join("");
    Icons.hydrate();
  }

  document.getElementById("items").addEventListener("click", function (e) {
    var rb = e.target.closest("[data-read]");
    if (rb) {
      var on = App.toggleLibraryRead(rb.getAttribute("data-read"));
      if (window.haptic) haptic("select");
      render();
      return;
    }
    var nb = e.target.closest("[data-note]");
    if (nb) {
      var id = nb.getAttribute("data-note");
      var cur = stateOf(id).note || "";
      // Простое поле ввода вместо модального окна: prompt в Telegram WebView
      // работает нестабильно, поэтому разворачиваем textarea прямо в карточке.
      openNote(id, cur);
    }
  });

  function openNote(id, cur) {
    var card = document.querySelector('.res[data-id="' + CSS.escape(id) + '"]');
    if (!card || card.querySelector(".noteEdit")) return;
    var box = document.createElement("div");
    box.className = "noteEdit";
    box.style.marginTop = "var(--sp-3)";
    box.innerHTML = '<label class="field"><span class="lb">Ваша заметка</span>' +
      "<textarea></textarea></label>" +
      '<div class="btn-row"><button class="btn sm ghost" data-cancel="1">Отмена</button>' +
      '<button class="btn sm" data-save="1">Сохранить</button></div>';
    card.appendChild(box);
    var ta = box.querySelector("textarea");
    ta.value = cur;
    ta.focus();
    box.addEventListener("click", function (e) {
      if (e.target.getAttribute("data-cancel")) { box.remove(); return; }
      if (e.target.getAttribute("data-save")) {
        App.saveLibraryNote(id, ta.value);
        toast("Заметка сохранена");
        render();
      }
    });
  }

  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest("[data-f]");
    if (!b) return;
    filter = b.getAttribute("data-f");
    Array.prototype.forEach.call(this.children, function (c) {
      c.classList.toggle("on", c === b);
    });
    render();
  });

  document.getElementById("topicFilters").addEventListener("click", function (e) {
    var b = e.target.closest("[data-t]");
    if (!b) return;
    topicFilter = b.getAttribute("data-t") || null;
    render();
  });

  document.getElementById("levelFilters").addEventListener("click", function (e) {
    var b = e.target.closest("[data-l]");
    if (!b) return;
    level = parseInt(b.getAttribute("data-l"), 10);
    Array.prototype.forEach.call(this.children, function (c) {
      c.classList.toggle("on", c === b);
    });
    render();
  });

  var input = document.getElementById("q");
  var clear = document.getElementById("clear");
  input.addEventListener("input", function () {
    query = input.value.trim();
    clear.classList.toggle("hidden", !query);
    render();
  });
  clear.addEventListener("click", function () {
    input.value = ""; query = ""; clear.classList.add("hidden"); render();
  });

  render();
  Icons.hydrate();

  // Открытие конкретного материала по ссылке из поиска: подсвечиваем карточку.
  var id = App.param("id");
  if (id) {
    var card = document.querySelector('.res[data-id="' + CSS.escape(id) + '"]');
    if (card) {
      card.style.borderColor = "var(--accent)";
      card.scrollIntoView({ block: "center" });
    }
  }
})();
</script>
</body>
</html>
